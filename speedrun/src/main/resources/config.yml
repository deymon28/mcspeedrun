# ----------------------------------------------------------------
# Speedrun Plugin Configuration
# EN: Main configuration file for the Speedrun plugin
# UA: Головний конфігураційний файл для плагіна Speedrun
# ----------------------------------------------------------------

web-config:
  # EN: Starts a local browser UI for editing this config. A one-run token is printed in the server console.
  # UA: Starts a local browser UI for editing this config.
  enabled: true
  # EN: Keep this on 127.0.0.1 unless you intentionally expose the editor outside the server machine.
  # UA: Keep this on 127.0.0.1 unless you intentionally expose the editor outside the server machine.
  bind: "127.0.0.1"
  port: 8765

settings:
  # EN: NORMAL or CASUAL/HARDCORE - all locations have coordinates from start (with landmarks). In Nether, gold blocks are highlighted (within radius from config)./
  # UA: NORMAL або CASUAL/HARDCORE - всі локації зі старту мають координати (і мають орієнтири). В Незері підсвічуються золоті блоки (в радіусі з конфіга)./Або тільки таймер.
  gamemode: "NORMAL"

  # EN: The language file to use from the 'lang' folder (e.g., 'en', 'uk').
  # UA: Мовний файл для використання з папки 'lang' (наприклад, 'en', 'uk').
  language: "en"

  # EN: Timer will start automatically when the first player joins the server. If 'false', the timer starts from the moment the server is launched.
  # UA: Таймер запуститься автоматично, коли перший гравець приєднається до сервера. При 'false' таймер іде з моменту запуску сервера.
  start-on-first-join: true

  # EN: When start-on-first-join starts the run, also set loaded worlds to day time.
  # UA: Коли start-on-first-join запускає забіг, також встановити день у завантажених світах.
  reset_time_on_join: true

  # EN: The ability to reassign the coordinates of any location using the command '/run new LOC_NAME'. If 'False', only works for 'Nether portal'.
  # UA: Можливість перепризначити координати будь-якої локації за допомогою команди '/run new LOC_NAME'. Якщо 'False', працює лише для 'Nether portal'.
  allow-reassigning-locations: true

  # EN: Time in seconds to find the village before the task is removed. 600 = 10 minutes.
  # UA: Час у секундах для знаходження села перед видаленням завдання. 600 = 10 хвилин.
  village-search-timeout: 600

  # EN: How to track player resources for tasks.
  # UA: Як відстежувати ресурси гравця для завдань.
  # INVENTORY: Only counts items currently in players' inventories.
  # CUMULATIVE: Counts all items ever picked up or crafted by players during the run. (More demanding on the server)
  # INVENTORY: Рахує лише предмети, які зараз знаходяться в інвентарі гравців.
  # CUMULATIVE: Рахує всі предмети, які коли-небудь підбирались або крафтились гравцями під час забігу. (Більш вимогливо до сервера)
  task-tracking-mode: "INVENTORY"

  # EN: Dynamically scale required resource amounts based on the number of players online.
  # UA: Динамічне масштабування необхідної кількості ресурсів на основі кількості гравців онлайн.
  scale-resources-by-playercount:
    enabled: true
    # EN: Formula: base_amount * (1 + (player_count - 1) * multiplier)
    # EN: A value of 0.5 means each additional player adds 50% of the base requirement.
    # UA: Значення 0.5 означає, що кожен додатковий гравець додає 50% базової вимоги.
    multiplier: 0.5

  # EN: Log details of each speedrun attempt to 'logs/speedrun-log'.
  # UA: Записувати деталі кожної спроби спідрана в 'logs/speedrun-log'.
  log-attempts: true

  chunk-biome-logging:
    # EN: Logs each visited Overworld chunk once with its sampled biome for activity-map analysis.
    # UA: Логує кожен відвіданий чанк Overworld один раз з біомом для аналізу карти активності.
    enabled: true

  coordinate-display:
    # EN: UNIFIED shows linked Overworld/Nether coordinates together, SEPARATE adds the source world, CONDITIONAL changes by player dimension.
    # UA: UNIFIED показує пов'язані координати Верхнього світу/Незеру разом, SEPARATE додає світ-джерело, CONDITIONAL змінює вигляд залежно від виміру гравця.
    mode: "CONDITIONAL"

  # EN: Settings for the automatic structure scanner
  # UA: Налаштування для автоматичного сканера структур
  proximity-scanner:
    lava-pool:
      # EN: Radius in blocks to scan for lava pools
      # UA: Радіус у блоках для сканування лавових озер
      radius: 16
      # EN: Minimum number of lava source blocks required to consider it a valid lava pool
      # UA: Мінімальна кількість джерельних блоків лави, необхідних для розгляду як валідне лавове озеро
      required-source-blocks: 12
    village:
      # EN: Radius in blocks to scan for village structures
      # UA: Радіус у блоках для сканування структур села
      radius: 32
    nether-portal:
      # EN: Radius to check if player is near an existing nether portal
      # UA: Радіус для перевірки, чи знаходиться гравець поблизу існуючого незерського порталу
      check-radius: 4
      # EN: Radius for precise search of the Nezer portal
      # UA: Радіус для точного пошуку Незер порталу
      search-radius: 90

    # EN:
    # UA: Час пошуку точних координат порталу для серверів Paper, після якого буде використано приблизні координати(потрібно для виключення ситуації з непрогрузкою чанків, через що координати не знаходились)
    portal-search-timeout: 15

# ----------------------------------------------------------------
# Tracking and logging options
# ----------------------------------------------------------------
tracking:
  player-blocks:
    # EN: Logs player block coordinates on movement for future map/video playback analysis. Can produce large JSON logs.
    # UA: Логує блокові координати гравця під час руху для майбутнього аналізу карти/відеоповтору. Може створювати великі JSON-логи.
    enabled: false

# ----------------------------------------------------------------
# Diagnostics
# ----------------------------------------------------------------
diagnostics:
  trace:
    # EN: Writes detailed JSONL diagnostics to plugins/Speedrun/traces. Enable when reproducing bugs.
    # UA: Записує детальну JSONL-діагностику у plugins/Speedrun/traces. Вмикайте під час відтворення багів.
    enabled: false
    # EN: Also mirror trace events to the normal server console/log.
    # UA: Також дублювати trace-події у звичайну консоль/лог сервера.
    mirror-to-console: false
    # EN: ALL, or selected categories: diagnostics, lifecycle, compass, lodestone, scanner, structure, portal.
    # UA: ALL або окремі категорії: diagnostics, lifecycle, compass, lodestone, scanner, structure, portal.
    categories: ["ALL"]

# ----------------------------------------------------------------
# CASUAL MODE SETTINGS
# ----------------------------------------------------------------
casual:
  enabled: true
  start-pre-scan:
    # EN: Enables controlled discovery when a Casual run starts. Locate API calls are used only by LOCATE mode.
    # UA: Вмикає контрольований пошук на старті Casual-забігу. API locate використовується лише в режимі LOCATE.
    enabled: false
    # EN: SAFE scans only already loaded chunks. BALANCED/AGGRESSIVE add a bounded Paper async chunk queue. LOCATE uses bounded Bukkit/Paper locate API calls plus loaded-chunk fallback.
    # UA: SAFE сканує лише вже завантажені чанки. BALANCED/AGGRESSIVE додають обмежену Paper async-чергу чанків. LOCATE використовує обмежені Bukkit/Paper locate API виклики плюс fallback по завантажених чанках.
    mode: "BALANCED"
    radius: 1000
    loaded-chunk-radius: 10
    include-lava-pool: true
    lava-pool-vertical-scan:
      # EN: Blocks below the player origin to scan for start pre-scan lava pools.
      # UA: Кількість блоків нижче позиції гравця для пошуку лавових озер під час start pre-scan.
      below-player: 12
      # EN: Blocks above the player origin to scan for start pre-scan lava pools.
      # UA: Кількість блоків вище позиції гравця для пошуку лавових озер під час start pre-scan.
      above-player: 32
    safety:
      # EN: Hard caps applied even if a profile is configured higher, protecting the server from accidental massive chunk generation.
      # UA: Жорсткі ліміти застосовуються навіть якщо профіль налаштований вище, захищаючи сервер від випадкової масової генерації чанків.
      max-chunks-per-run: 8
      max-queued-chunks: 5000
    locate:
      # EN: LOCATE mode only. Radius is in API search units/chunks; calls are synchronous, so keep calls-per-run low.
      # UA: Тільки режим LOCATE. Радіус у API одиницях/чанках пошуку; виклики синхронні, тому calls-per-run має бути малим.
      radius-chunks: 96
      period-ticks: 20
      calls-per-run: 1
      find-unexplored: false
      targets:
        village: true
        stronghold: true
        nether-structures: true
    profiles:
      SAFE:
        chunks-per-run: 0
        period-ticks: 40
        max-queued-chunks: 0
        load-missing-chunks: false
        scan-spawn: false
        scan-players: false
        include-nether: false
      BALANCED:
        chunks-per-run: 2
        period-ticks: 20
        max-queued-chunks: 1500
        load-missing-chunks: true
        scan-spawn: true
        scan-players: true
        include-nether: false
      AGGRESSIVE:
        chunks-per-run: 8
        period-ticks: 10
        max-queued-chunks: 5000
        load-missing-chunks: true
        scan-spawn: true
        scan-players: true
        include-nether: true
      LOCATE:
        chunks-per-run: 0
        period-ticks: 40
        max-queued-chunks: 0
        load-missing-chunks: false
        scan-spawn: false
        scan-players: false
        include-nether: false
  compass:
    # EN: Shows the old test-only Nether Reference destination. Disabled by default because it is not tied to actual run state.
    # UA: Показує старий тестовий пункт Nether Reference. Вимкнено за замовчуванням, бо він не прив'язаний до реального стану забігу.
    show-nether-reference: false
    death-location:
      # EN: Adds the player's own last death location to their compass menu.
      # UA: Додає власну останню точку смерті гравця у його меню компаса.
      enabled: true
  # EN: Optional waypoints for navigating the world (no nether, no end).
  # UA: Опціональні орієнтири для навігації світом (без незеру, без енду).
  structure_waypoints:
    # EN: Enable or disable structure waypoints in casual mode
    # UA: Увімкнути або вимкнути орієнтири структур у казуальному режимі
    enabled: true
    # EN: END_GATEWAY is the default compact beam marker. BEACON remains available as an alternate marker type.
    # UA: END_GATEWAY є стандартним компактним маркером з променем. BEACON лишається доступним альтернативним типом маркера.
    type: "END_GATEWAY"
    # EN: Horizontal offset from the detected structure, so the marker does not overwrite important blocks.
    # UA: Горизонтальний відступ від знайденої структури, щоб маркер не перезаписував важливі блоки.
    offset-blocks: 10
    # EN: How often waypoint positions are refreshed.
    # UA: Як часто оновлюються позиції вейпоінтів.
    update-interval-seconds: 10

  player-tab-coordinates: true

  nether_gold_highlight:
    # EN: Highlight gold blocks around players while they are in the Nether.
    # UA: Підсвічувати золоті блоки навколо гравців, коли вони в Незері.
    enabled: true
    radius: 24

# ----------------------------------------------------------------
# Task Progression
# EN: Define the stages and the tasks within each stage.
# EN: The plugin will progress from one stage to the next as all tasks are completed.
# UA: Визначити етапи та завдання в кожному етапі.
# UA: Плагін буде переходити з одного етапу до наступного, коли всі завдання виконані.
# ----------------------------------------------------------------
progression:
  settings:
    # EN: ACTIVE_STAGE shows only the current stage. ALL_STAGES shows all tasks for the player's current world. ALL_GAME_STAGES groups all tasks by world on the scoreboard.
    # UA: ACTIVE_STAGE показує лише поточний етап. ALL_STAGES показує всі завдання для поточного світу гравця. ALL_GAME_STAGES групує всі завдання за світами на скорборді.
    task-display-mode: "ALL_GAME_STAGES"
    completed-task-hide:
      # EN: If enabled, completed tasks disappear from task displays after timeout-seconds.
      # UA: Якщо увімкнено, завершені завдання зникають з відображення після timeout-seconds.
      enabled: true
      timeout-seconds: 10

  # EN: Stage 1: Basic setup - Initial resource gathering phase
  # UA: Етап 1: Базова підготовка - фаза початкового збору ресурсів
  1_GETTING_STARTED:
    display-name: "Getting Started"
    # EN: Tasks are displayed when the player is in this world.
    # UA: Завдання відображаються, коли гравець знаходиться в цьому світі.
    world: "NORMAL"
    tasks:
      # EN: Use any log type as the key; the plugin aggregates all wood types. OAK_LOG is recommended.
      # UA: Використовуйте будь-який тип колоди як ключ; плагін агрегує всі типи деревини. OAK_LOG рекомендується.
      OAK_LOG: { amount: 16, display-name: "Wood", srbp: true}
      COBBLESTONE: { amount: 16, display-name: "Cobblestone", srbp: true}

  # EN: Stage 2: Advancing to Iron Age - Tool and equipment upgrade phase
  # UA: Етап 2: Перехід до Залізного віку - фаза покращення інструментів та обладнання
  2_IRON_AGE:
    display-name: "Iron Age"
    world: "NORMAL"
    tasks:
      IRON_INGOT: { amount: 7, display-name: "Iron Ingots", srbp: false}
      # EN: Use BREAD as a key for all cooked foods. The plugin will aggregate them.
      # UA: Використовуйте BREAD як ключ для всіх приготованих продуктів. Плагін агрегує їх.
      BREAD: { amount: 16, display-name: "Cooked Food", srbp: true}

  # EN: Stage 3: Nether Exploration - Preparation for End dimension
  # UA: Етап 3: Дослідження Незеру - підготовка до виміру Енду
  3_NETHER_EXPLORATION:
    display-name: "Nether Preparation"
    world: "NETHER"
    tasks:
      ENDER_PEARL: { amount: 16, display-name: "Ender Pearls", srbp: false}
      BLAZE_ROD: { amount: 8, display-name: "Blaze Rods", srbp: false}

  4_NETHER_STRUCTURES:
    display-name: "Nether Structures"
    world: "NETHER"
    tasks: {}

  5_STRONGHOLD:
    display-name: "Stronghold"
    world: "NORMAL"
    tasks: {}

# ----------------------------------------------------------------
# Optional cosmetic rewards for completing tasks or stages.
# ----------------------------------------------------------------
rewards:
  # EN: Reward system configuration for visual and audio feedback
  # UA: Конфігурація системи винагород для візуального та звукового зворотнього зв'язку
  # EN: Set to true to enable rewards
  # UA: Встановити true для увімкнення винагород
  enabled: true

  # EN: Command to run from the console when a single task is completed.
  # UA: Команда для виконання з консолі, коли окреме завдання виконано.
  on-task-complete:
    - "api:sound minecraft:entity.player.levelup 1.0 1.5"  # EN: Level up sound effect / UA: Звуковий ефект підвищення рівня
    - "api:sound minecraft:item.totem.use 1.0 1.0"         # EN: Totem use sound effect / UA: Звуковий ефект використання тотема
    - "api:particle minecraft:totem_of_undying 30 0.5 0.5 0.5 0"  # EN: Totem particles / UA: Частки тотема
    - "api:particle minecraft:heart 10 0.2 0.2 0.2 0.1"   # EN: Heart particles / UA: Частки сердець

  # EN: Commands to run when an entire stage is completed
  # UA: Команди для виконання, коли весь етап завершено
  on-stage-complete:
    - "api:sound minecraft:block.end_portal.spawn 1.0 1.0"     # EN: End portal spawn sound / UA: Звук появи енд порталу
    - "api:particle minecraft:spark 50 0.5 0.5 0.5 0.1"       # EN: Spark particles / UA: Частки іскор
    - "api:particle minecraft:flash 1 0 0 0 0"                 # EN: Flash particle / UA: Частка спалаху
    - "api:particle minecraft:explosion_emitter 1 0 0 0 0"     # EN: Explosion emitter particle / UA: Частка вибуху
