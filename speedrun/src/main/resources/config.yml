# ----------------------------------------------------------------
# Speedrun - main configuration
#
# You can edit this file directly or use the browser editor:
#   /run webconfig   (administrators only, opens a private local link)
#
# After editing this file by hand, run /run reload or restart the server.
# Full reference: docs/configuration.md in the project repository.
# ----------------------------------------------------------------

# Managed by the plugin. When a different plugin version starts, the
# configuration is upgraded automatically: your values are kept, new settings
# get their defaults, and a backup is written to config-backups/.
# Do not edit these two values.
config-version: 1
plugin-version: "${version}"

web-config:
  # Local browser editor for this file. Administrators get a private access link with /run webconfig.
  enabled: true
  # Network address of the editor. Keep 127.0.0.1 unless you deliberately expose it outside this machine.
  bind: "127.0.0.1"
  # TCP port of the editor (1024-65535).
  port: 8765
  # Allow the editor to add reward entries that run console commands. Sound and particle
  # rewards ("api:" entries) are always allowed. Console commands can still be added here by hand.
  allow-console-reward-commands: false

settings:
  # NORMAL: timer, tasks, and location tracking.
  # CASUAL: everything in NORMAL plus a navigation compass, waypoints, Nether gold highlighting, and tab coordinates.
  # HARDCORE: only the timer; all assistance is disabled.
  gamemode: "NORMAL"

  # Language of in-game messages: en, uk, de, es, fr, pt_BR, pl, zh_CN.
  # Message files are in plugins/Speedrun/lang and can be customized.
  language: "en"

  # Start the timer when the first player joins. If false, the timer starts when the server starts.
  start-on-first-join: true

  # When the first player join starts a run, also set the Overworld time to morning.
  reset_time_on_join: true

  # Pause the timer automatically while nobody is online and resume when a player returns.
  # Runs paused manually with /run pause stay paused.
  pause-when-empty: false

  # Allow /run new <location> to move locations that were already found. If false, only empty locations can be set.
  allow-reassigning-locations: true

  # Seconds to find a village before the village target is dropped. 600 = 10 minutes.
  village-search-timeout: 600

  # How collected resources count towards tasks:
  #   INVENTORY  - items currently in online players' inventories.
  #   CUMULATIVE - every item picked up or crafted during the run, even if used later.
  task-tracking-mode: "INVENTORY"

  # Scale required resource amounts with the number of online players (only tasks with srbp: true).
  scale-resources-by-playercount:
    enabled: true
    # Required amount = base * (1 + (players - 1) * multiplier). 0.5 adds 50% per extra player.
    multiplier: 0.5

  # Write a text and a JSON log for every attempt to plugins/Speedrun/logs.
  log-attempts: true

  # Notify administrators on join about configuration upgrades and how to open the editor.
  notify-admins-on-join: true

  chunk-biome-logging:
    # Log each visited Overworld chunk once with its biome (for activity maps in the JSON log).
    enabled: true

  coordinate-display:
    # How coordinates appear on the scoreboard:
    #   UNIFIED     - always show the coordinates of the world where the location is.
    #   SEPARATE    - only show locations of the world the player is in.
    #   CONDITIONAL - convert Overworld/Nether coordinates to the player's current world.
    mode: "CONDITIONAL"

  scoreboard:
    # Hide the red numbers on the right side of the sidebar (Paper only; ignored elsewhere).
    hide-score-numbers: true

  # Automatic detection of locations around players.
  proximity-scanner:
    lava-pool:
      # Horizontal radius in blocks to look for lava pools around each player.
      radius: 16
      # Lava source blocks needed to count as a pool.
      required-source-blocks: 12
    village:
      # Radius in blocks to look for village bells around each player.
      radius: 32
    nether-portal:
      # Radius in blocks around a lit block or portal entry to find the portal frame.
      check-radius: 4
      # Radius in blocks to find the exact exit portal after a player travels through a portal (maximum 160).
      search-radius: 90

    # Seconds to wait for the exact exit portal search before the approximate arrival point is used.
    portal-search-timeout: 15

# ----------------------------------------------------------------
# Personal bests and splits
# ----------------------------------------------------------------
records:
  # Remember the best completion time and the best time for each stage in records.yml.
  enabled: true
  # Announce the time and the difference to the best split whenever a stage is completed.
  announce-splits: true

# ----------------------------------------------------------------
# Tracking and logging
# ----------------------------------------------------------------
tracking:
  player-blocks:
    # Log block coordinates of every player movement for replay/map analysis. Produces large JSON logs.
    enabled: false

# ----------------------------------------------------------------
# Diagnostics
# ----------------------------------------------------------------
diagnostics:
  trace:
    # Write detailed JSONL diagnostics to plugins/Speedrun/traces. Enable while reproducing a bug.
    enabled: false
    # Also print trace events to the server console.
    mirror-to-console: false
    # ALL, or a list of: diagnostics, lifecycle, compass, lodestone, scanner, structure, portal.
    categories: ["ALL"]

# ----------------------------------------------------------------
# CASUAL mode
# ----------------------------------------------------------------
casual:
  # Master switch for CASUAL features when settings.gamemode is CASUAL.
  enabled: true
  start-pre-scan:
    # Search for structures in the background when a CASUAL run starts.
    enabled: false
    # SAFE       - only chunks that are already loaded.
    # BALANCED   - also loads a limited number of missing chunks (async on Paper).
    # AGGRESSIVE - larger chunk budget, also scans the Nether.
    # LOCATE     - uses the server's structure locate function in small steps.
    mode: "BALANCED"
    # Maximum distance in blocks from spawn/players for background scanning.
    radius: 1000
    # Radius in chunks around each player that is scanned when chunks are already loaded.
    loaded-chunk-radius: 10
    # Also look for lava pools during the pre-scan.
    include-lava-pool: true
    # Allow BALANCED/AGGRESSIVE to load missing chunks on servers without asynchronous chunk
    # loading (Spigot/CraftBukkit). Loads are limited to one chunk per tick but may still cost TPS.
    allow-sync-chunk-loading: false
    lava-pool-vertical-scan:
      # Blocks below the scan origin to look for lava pools.
      below-player: 12
      # Blocks above the scan origin to look for lava pools.
      above-player: 32
    safety:
      # Hard limits applied on top of every profile to protect the server from mass chunk generation.
      max-chunks-per-run: 8
      max-queued-chunks: 5000
    locate:
      # LOCATE mode only. Search radius in chunks. Each call runs on the server thread, so keep calls-per-run low.
      radius-chunks: 96
      period-ticks: 20
      calls-per-run: 1
      find-unexplored: false
      targets:
        village: true
        stronghold: true
        nether-structures: true
    # Budgets for each mode. chunks-per-run chunks are processed every period-ticks.
    profiles:
      SAFE:
        chunks-per-run: 0
        period-ticks: 40
        max-queued-chunks: 0
        load-missing-chunks: false
        scan-spawn: false
        scan-players: false
        include-nether: false
      BALANCED:
        chunks-per-run: 2
        period-ticks: 20
        max-queued-chunks: 1500
        load-missing-chunks: true
        scan-spawn: true
        scan-players: true
        include-nether: false
      AGGRESSIVE:
        chunks-per-run: 8
        period-ticks: 10
        max-queued-chunks: 5000
        load-missing-chunks: true
        scan-spawn: true
        scan-players: true
        include-nether: true
      LOCATE:
        chunks-per-run: 0
        period-ticks: 40
        max-queued-chunks: 0
        load-missing-chunks: false
        scan-spawn: false
        scan-players: false
        include-nether: false
  compass:
    # Show the legacy fixed "Nether Reference" destination (not linked to the run).
    show-nether-reference: false
    death-location:
      # Add each player's last death point to their own compass menu.
      enabled: true
  # Light beams above found Overworld locations.
  structure_waypoints:
    enabled: true
    # END_GATEWAY: compact beam. BEACON: classic beacon beam.
    type: "END_GATEWAY"
    # Horizontal distance from the location so the marker does not replace important blocks.
    offset-blocks: 10
    # Seconds between waypoint refreshes.
    update-interval-seconds: 10

  # Show each player's own coordinates at the top of the tab list.
  player-tab-coordinates: true

  nether_gold_highlight:
    # Make gold blocks glow around players in the Nether and inside found bastions.
    enabled: true
    # Radius in blocks around each player in the Nether.
    radius: 24

# ----------------------------------------------------------------
# Task progression
# Stages are completed in order (sorted by their key). When all tasks of a
# stage are done, the next stage starts.
#   world: NORMAL, NETHER, or THE_END - where the stage's tasks are shown.
#   tasks: <MATERIAL or STRUCTURE_<LOCATION>>: { amount, display-name, srbp }
#     srbp: scale the amount by player count (see settings.scale-resources-by-playercount).
#   Special keys: OAK_LOG counts every log/wood type, BREAD counts every cooked food.
#   Structure keys: STRUCTURE_VILLAGE, STRUCTURE_LAVA_POOL, STRUCTURE_NETHER_PORTAL,
#     STRUCTURE_FORTRESS, STRUCTURE_BASTION, STRUCTURE_END_PORTAL.
# ----------------------------------------------------------------
progression:
  settings:
    # ACTIVE_STAGE: only the current stage. ALL_STAGES: all tasks of the player's world.
    # ALL_GAME_STAGES: all tasks grouped by world.
    task-display-mode: "ALL_GAME_STAGES"
    completed-task-hide:
      # Hide completed tasks after timeout-seconds.
      enabled: true
      timeout-seconds: 10

  1_GETTING_STARTED:
    display-name: "Getting Started"
    world: "NORMAL"
    tasks:
      OAK_LOG: { amount: 16, display-name: "Wood", srbp: true }
      COBBLESTONE: { amount: 16, display-name: "Cobblestone", srbp: true }

  2_IRON_AGE:
    display-name: "Iron Age"
    world: "NORMAL"
    tasks:
      IRON_INGOT: { amount: 7, display-name: "Iron Ingots", srbp: false }
      BREAD: { amount: 16, display-name: "Cooked Food", srbp: true }

  3_NETHER_EXPLORATION:
    display-name: "Nether Preparation"
    world: "NETHER"
    tasks:
      ENDER_PEARL: { amount: 16, display-name: "Ender Pearls", srbp: false }
      BLAZE_ROD: { amount: 8, display-name: "Blaze Rods", srbp: false }

  4_NETHER_STRUCTURES:
    display-name: "Nether Structures"
    world: "NETHER"
    tasks: {}

  5_STRONGHOLD:
    display-name: "Stronghold"
    world: "NORMAL"
    tasks: {}

# ----------------------------------------------------------------
# Rewards for completed tasks and stages
#   "api:sound <sound> [volume] [pitch]"
#   "api:particle <particle> [count] [offsetX] [offsetY] [offsetZ] [speed]"
#   Any other line is run as a console command; %player% is replaced with each player's name.
# ----------------------------------------------------------------
rewards:
  enabled: true

  on-task-complete:
    - "api:sound minecraft:entity.player.levelup 1.0 1.5"
    - "api:sound minecraft:item.totem.use 1.0 1.0"
    - "api:particle minecraft:totem_of_undying 30 0.5 0.5 0.5 0"
    - "api:particle minecraft:heart 10 0.2 0.2 0.2 0.1"

  on-stage-complete:
    - "api:sound minecraft:block.end_portal.spawn 1.0 1.0"
    - "api:particle minecraft:spark 50 0.5 0.5 0.5 0.1"
    - "api:particle minecraft:flash 1 0 0 0 0"
    - "api:particle minecraft:explosion_emitter 1 0 0 0 0"
