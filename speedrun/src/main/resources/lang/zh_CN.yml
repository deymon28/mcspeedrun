# Speedrun - 简体中文消息
#
# 颜色代码：&0-&9、&a-&f、&l（粗体）、&o（斜体）、&n（下划线）、&m（删除线）、&r（重置）。
# 同样支持 MiniMessage 标签，例如 <green>、<bold> 或 <#ff8800>。
# 像 %player% 这样的占位符由插件填充，必须保留。
# 此文件中缺失的消息会使用内置文本。

# 添加在聊天消息前面的文本，例如 "&e[Speedrun] &r"。
prefix: ""

