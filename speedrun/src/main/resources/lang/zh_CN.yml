    players: "&f玩家：&b%players%"
    footer: "&6-----------------------------------"
  tasks:
    header: "&6--------- &e当前任务 &6---------"
    no-tasks: "&7这个世界里没有未完成的任务。"
    footer: "&6-----------------------------------"

