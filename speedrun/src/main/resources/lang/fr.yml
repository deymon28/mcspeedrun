# Speedrun - Messages en français
#
# Codes de couleur : &0-&9, &a-&f, &l (gras), &o (italique), &n (souligné), &m (barré), &r (réinitialiser).
# Les balises MiniMessage comme <green>, <bold> ou <#ff8800> sont également prises en charge.
# Les variables comme %player% sont remplies par le plugin et doivent être conservées.
# Les messages absents de ce fichier utilisent le texte intégré.

# Texte ajouté devant les messages du chat, par exemple "&e[Speedrun] &r".
prefix: ""

