# Speedrun - komunikaty po polsku
#
# Kody kolorów: &0-&9, &a-&f, &l (pogrubienie), &o (kursywa), &n (podkreślenie), &m (przekreślenie), &r (reset).
# Znaczniki MiniMessage, takie jak <green>, <bold> lub <#ff8800>, również są obsługiwane.
# Symbole zastępcze, np. %player%, są uzupełniane przez plugin i muszą zostać zachowane.
# Komunikaty brakujące w tym pliku korzystają z wbudowanego tekstu.

# Tekst dodawany przed wiadomościami na czacie, na przykład "&e[Speedrun] &r".
prefix: ""

