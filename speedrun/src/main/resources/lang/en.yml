# Speedrun - English messages
#
# Color codes: &0-&9, &a-&f, &l (bold), &o (italic), &n (underline), &m (strikethrough), &r (reset).
# MiniMessage tags such as <green>, <bold>, or <#ff8800> are supported as well.
# Placeholders like %player% are filled in by the plugin and must be kept.
# Messages missing from this file fall back to the built-in text.

# Text added in front of chat messages, for example "&e[Speedrun] &r".
prefix: ""

commands:
  no-permission: "&cYou do not have permission to use this command."
  player-only: "&cThis command can only be used by a player in the game."
  reloaded: "&aConfiguration and message files were reloaded."
  run-started: "&aThe speedrun has started."
  run-already-started: "&cA speedrun is already running."
  run-stopped: "&aThe speedrun was stopped."
  run-not-running: "&cNo speedrun is running."
  timer-paused: "&eThe timer is paused."
  timer-resumed: "&aThe timer is running again."
  run-reset: "&eThe speedrun was reset. A new run starts now."
  stage-skipped: "&eSkipped to the next stage. This run will not count for personal bests."
  unknown-subcommand: "&cUnknown subcommand. Type &e/%label% help &cfor a list of commands."
  usage-new: "&cUsage: /run new <%structures%> [x y z]"
  usage-remove: "&cUsage: /run remove <location>"
  invalid-structure: "&cUnknown location. Valid locations: %structures%"
  location-update-failed: "&cCould not update the location: %location%"
  location-updated: "&aLocation updated: %location%"
  structure-hidden: "&aLocation hidden: %structure%"
  locate-pos1: "&aFirst throw saved (position and view direction)."
  locate-pos2: "&aSecond throw saved (position and view direction)."
  locate-invalid-coordinates: "&cInvalid coordinates. Use numbers only."
  locate-usage: "&eUsage: /run locate <pos1|pos2> or /run locate <x1> <y1> <z1> <x2> <y2> <z2>"
  locate-header: "&a--- Stronghold estimate ---"
  locate-predicted: "&aEstimated End Portal: &e%coords% &7(Nether: &c%nether_x%, %nether_z%&7)"
  locate-failed: "&cCould not calculate a location. The two throws are probably parallel; throw again from another spot."
  help:
    header: "&6--------- &eSpeedrun commands &6---------"
    help: "&e/%label% help &7- show this list"
    status: "&e/%label% status &7- timer, stage, and players"
    tasks: "&e/%label% tasks &7- open tasks in your world"
    records: "&e/%label% records &7- personal best and best splits"
    givecompass: "&e/%label% givecompass [player] &7- get a navigation compass"
    start: "&e/%label% start &7- start the speedrun"
    pause: "&e/%label% pause &7- pause or resume the timer"
    stop: "&e/%label% stop &7- stop the speedrun"
    reset: "&e/%label% reset &7- reset and start a new run"
    skipstage: "&e/%label% skipstage &7- complete the current stage"
    new: "&e/%label% new <location> [x y z] &7- set a location"
    remove: "&e/%label% remove <location> &7- hide a location"
    locate: "&e/%label% locate <pos1|pos2> &7- estimate the stronghold from two Eye of Ender throws"
    reload: "&e/%label% reload &7- reload configuration and messages"
    webconfig: "&e/%label% webconfig [restart|stop] &7- open the browser settings editor"
    admin-footer: "&7Tip: configure everything in your browser with &e/run webconfig&7."
  givecompass:
    no-permission-others: "&cYou do not have permission to give compasses to other players."
    player-not-found: "&cPlayer not found: %player%"
    usage: "&cUsage: /run givecompass [player]"
    received: "&aYou received a Navigation Compass."
    gave: "&aGave a Navigation Compass to %player%."
  webconfig:
    usage: "&cUsage: /run webconfig [restart|stop]"
    unavailable: "&cThe web editor is not running. Enable web-config.enabled in config.yml or use /run webconfig restart."
    url: "<green>Settings editor: <click:open_url:'%url%'><hover:show_text:'Open in your browser'><yellow><u>click to open</u></yellow></hover></click>"
    url-console: "&aSettings editor: &e%url%"
    restarted: "<green>The editor was restarted with a new link: <click:open_url:'%url%'><yellow><u>click to open</u></yellow></click>"
    restarted-console: "&aThe editor was restarted with a new link: &e%url%"
    private: "&7This link is private: anyone who has it can change the settings. /run webconfig restart creates a new one."
    stopped: "&aThe web editor was stopped until the next restart or /run webconfig restart."
  status:
    header: "&6--------- &eSpeedrun status &6---------"
    time: "&fTime: &e%time%"
    running: "&fStatus: &aRunning"
    paused: "&fStatus: &cPaused"
    idle: "&fStatus: &7Not running &8(/run start)"
    finished: "&fStatus: &aCompleted"
    stage: "&fCurrent stage: &d%stage%"
    players: "&fPlayers: &b%players%"
    footer: "&6-----------------------------------"
  tasks:
    header: "&6--------- &eCurrent tasks &6---------"
    no-tasks: "&7There are no open tasks in this world."
    footer: "&6-----------------------------------"

scoreboard:
  # Keep sidebar lines short: long location or task names are cut off by the client.
  title: "&e&lSPEEDRUN"
  time: "&fTime:"
  paused: "&c&lPAUSED"
  s-end: "&a&lRUN COMPLETE"
  locations-header: "&bLocations:"
  location-found: "&7%name%: &a%coords%"
  location-approximate: "&7%name%: &e~%coords%"
  location-pending: "&7%name%: &c???"
  village-timer: "&e[%time%]"
  normal-tasks-header: "&aOverworld:"
  nether-tasks-header: "&cNether:"
  end-tasks-header: "&5The End:"
  task-line: "&7- %name%: &f%progress%&7/&f%required%"
  task-complete: "&a✔ &m%name%"

messages:
  run-started: "&aThe speedrun has begun! Good luck."
  village-timeout: "&cTime is up for finding a village. The village target was dropped."
  structure-found: "&b%player% &ffound the &6%structure% &fat &b%coords%&f!"
  portal-lit: "&b%player% &fopened a portal to the &5Nether&f!"
  dragon-slain: "&a&lThe Ender Dragon has been slain! Speedrun complete!"
  final-time: "&a&lFinal time: %time%"
  stage-complete: "&d&lStage complete! &fOn to the next stage."
  unknown-structure-name: "&cUnknown location: %name%"
  reassigning-disabled: "&cMoving locations that were already found is disabled in the configuration."
  portal-reassigned: "&aThe portal location was set to your position."
  use-run-new-nether-portal: "&cUse /run new nether portal to move the portal."

records:
  header: "&6--------- &ePersonal bests (%mode%) &6---------"
  none: "&7No completed run yet. Kill the Ender Dragon to set the first record."
  best: "&fBest time: &e%time% &7(%date%, %runs% completed runs)"
  split-line: "&7- %stage%: &f%time%"
  split: "&d%stage% &fcompleted at &e%time% %delta%"
  new-best: "&6&lNew personal best! &e%time% %delta%"
  compare: "&fPersonal best: &e%best% %delta%"
  delta-ahead: "&a(-%delta%)"
  delta-behind: "&c(+%delta%)"
  delta-first: "&7(first record)"
  reset: "&aPersonal bests of the current game mode were reset."

admin:
  installed: "<green>Speedrun is installed. Set it up in your browser with <click:run_command:'/run webconfig'><yellow><u>/run webconfig</u></yellow></click>, or see <yellow>/run help</yellow>."
  upgraded: "&aSpeedrun was updated (%from% -> %to%). Your settings were kept: &f%transferred% &atransferred, &f%new% &anew with default values, &f%reset% &areset to defaults."
  reset-settings: "&eReset to defaults because the old value is no longer supported: &f%settings%"
  backup: "&7Your previous config.yml was saved to plugins/Speedrun/%file%."
  config-failed: "&cconfig.yml could not be loaded, so default settings are active. Check the server console, fix the file, and run /run reload."
  invalid-settings: "&eSome settings in config.yml are invalid and use default values: &f%settings%"

items:
  navigation-compass:
    name: "&6Navigation Compass"
    lore:
      - "&7Right-click to choose a destination."

compass:
  welcome-received: "&aWelcome! You received a &6Navigation Compass&a."
  welcome-hint: "&aRight-click it to choose where to go."
  no-destinations: "&cNo destinations in this dimension yet."
  destination-not-found: "&cThis destination is not available in your dimension."
  target-set: "&aYour compass now points to %destination% in %world%."
  target-invalid: "&cCould not set the compass target."
  null-world: "&cThis destination cannot be added because its world is not loaded."
  discovered: "&aDiscovered &b%destination%&a! It was added to your Navigation Compass."
  no-target-actionbar: "&7No destination. Right-click the compass to choose one."
  other-world-actionbar: "&c%destination% is in %world%"
  target-actionbar: "&b%destination% &7- &f%distance%"
  gui:
    title: "&1Destinations - %world%"
    overworld: "&aOverworld"
    nether: "&cNether"
    death-location-name: "&c%player%'s last death"
    destination-name: "&a%destination%"
    approximate-destination-name: "&e~%destination%"
    lore-x: "&7X: %x%"
    lore-y: "&7Y: %y%"
    lore-z: "&7Z: %z%"
    lore-world: "&7World: %world%"
    approximate-lore: "&eApproximate location from the background scan"
    click-hint: "&eClick to point your compass here"
    death-click-hint: "&eClick to track your last death"
    custom-location: "a custom location"
    generic-location: "Location"

tab:
  coordinates: "&eX: &f%x%  &eY: &f%y%  &eZ: &f%z%"

protection:
  structure-marker: "&cThis block belongs to a location marker and cannot be broken."
  hidden-lodestone: "&cThis block anchors a compass and cannot be broken."

