# Speedrun - Mensagens em português do Brasil
#
# Códigos de cor: &0-&9, &a-&f, &l (negrito), &o (itálico), &n (sublinhado), &m (tachado), &r (redefinir).
# Tags MiniMessage como <green>, <bold> ou <#ff8800> também são aceitas.
# Marcadores como %player% são preenchidos pelo plugin e devem ser mantidos.
# Mensagens ausentes neste arquivo usam o texto embutido.

# Texto adicionado antes das mensagens do chat, por exemplo "&e[Speedrun] &r".
prefix: ""

commands:
