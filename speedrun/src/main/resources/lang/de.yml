# Speedrun - Deutsche Nachrichten
#
# Farbcodes: &0-&9, &a-&f, &l (fett), &o (kursiv), &n (unterstrichen), &m (durchgestrichen), &r (zurücksetzen).
# MiniMessage-Tags wie <green>, <bold> oder <#ff8800> werden ebenfalls unterstützt.
# Platzhalter wie %player% werden vom Plugin ausgefüllt und müssen erhalten bleiben.
# Nachrichten, die in dieser Datei fehlen, greifen auf den eingebauten Text zurück.

# Text vor Chatnachrichten, zum Beispiel "&e[Speedrun] &r".
