# Speedrun - Mensajes en español
#
# Códigos de color: &0-&9, &a-&f, &l (negrita), &o (cursiva), &n (subrayado), &m (tachado), &r (restablecer).
# También se admiten etiquetas MiniMessage como <green>, <bold> o <#ff8800>.
# Los marcadores como %player% los rellena el plugin y deben conservarse.
# Los mensajes que falten en este archivo usan el texto integrado.

# Texto que se añade delante de los mensajes del chat, por ejemplo "&e[Speedrun] &r".
prefix: ""

commands:
  no-permission: "&cNo tienes permiso para usar este comando."
  player-only: "&cEste comando solo puede usarlo un jugador dentro del juego."
  reloaded: "&aSe recargaron la configuración y los archivos de mensajes."
  reload-progress-kept: "&eHay una partida en curso, así que se conservó su progreso. Las etapas y tareas cambiadas se aplican en la próxima partida."
  run-started: "&aEl speedrun ha comenzado."
  run-already-started: "&cYa hay un speedrun en curso."
  run-stopped: "&aEl speedrun se detuvo."
  run-not-running: "&cNo hay ningún speedrun en curso."
  timer-paused: "&eEl cronómetro está en pausa."
  timer-resumed: "&aEl cronómetro vuelve a correr."
  run-reset: "&eEl speedrun se reinició. Ahora empieza una nueva partida."
  stage-skipped: "&eSe saltó a la siguiente etapa. Esta partida no contará para los récords personales."
  stage-skip-unavailable: "&cNo hay ninguna etapa activa que saltar."
  unknown-subcommand: "&cSubcomando desconocido. Escribe &e/%label% help &cpara ver la lista de comandos."
  usage-new: "&cUso: /run new <%structures%> [x y z]"
