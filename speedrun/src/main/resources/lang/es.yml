  givecompass:
    no-permission-others: "&cNo tienes permiso para dar brújulas a otros jugadores."
    player-not-found: "&cJugador no encontrado: %player%"
    usage: "&cUso: /run givecompass [player]"
    received: "&aHas recibido una Brújula de navegación."
    gave: "&aSe entregó una Brújula de navegación a %player%."
  webconfig:
    usage: "&cUso: /run webconfig [restart|stop]"
