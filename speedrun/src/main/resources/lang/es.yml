    stopped: "&aEl editor web se detuvo hasta el próximo reinicio o /run webconfig restart."
  status:
    header: "&6--------- &eEstado de Speedrun &6---------"
    time: "&fTiempo: &e%time%"
    running: "&fEstado: &aEn curso"
    paused: "&fEstado: &cEn pausa"
    idle: "&fEstado: &7Sin ejecutar &8(/run start)"
    finished: "&fEstado: &aCompletado"
    stage: "&fEtapa actual: &d%stage%"
    players: "&fJugadores: &b%players%"
