    records: "&e/%label% records &7- récord personal y mejores parciales"
    givecompass: "&e/%label% givecompass [player] &7- obtener una brújula de navegación"
    start: "&e/%label% start &7- iniciar el speedrun"
    pause: "&e/%label% pause &7- pausar o reanudar el cronómetro"
    stop: "&e/%label% stop &7- detener el speedrun"
    reset: "&e/%label% reset &7- reiniciar y comenzar una nueva partida"
    skipstage: "&e/%label% skipstage &7- completar la etapa actual"
