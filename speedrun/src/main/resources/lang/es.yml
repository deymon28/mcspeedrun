  tasks:
    header: "&6--------- &eTareas actuales &6---------"
    no-tasks: "&7No hay tareas abiertas en este mundo."
    footer: "&6-----------------------------------"

scoreboard:
  # Mantén las líneas de la barra lateral cortas: el cliente corta los nombres largos de ubicaciones o tareas.
