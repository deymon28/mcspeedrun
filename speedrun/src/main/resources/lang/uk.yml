# Speedrun - українські повідомлення
#
# Кольорові коди: &0-&9, &a-&f, &l (жирний), &o (курсив), &n (підкреслений), &m (закреслений), &r (скидання).
# Теги MiniMessage, як-от <green>, <bold> або <#ff8800>, також підтримуються.
# Плейсхолдери на кшталт %player% підставляє плагін, тому їх потрібно залишати.
# Повідомлення, яких немає в цьому файлі, беруться зі вбудованого тексту.

# Текст перед повідомленнями в чаті, наприклад "&e[Speedrun] &r".
